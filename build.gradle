plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = 'https://masa.dy.fi/maven' }
    exclusiveContent {
        forRepository {
            maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
        }
        filter { includeGroup 'org.relativitymc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.modern_yarn_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    def localCarpet = file("${rootDir}/../fabric-carpet-26.3+v260915.jar")
    if (localCarpet.exists()) {
        modCompileOnly files(localCarpet)
    } else {
        modCompileOnly "carpet:fabric-carpet:${project.carpet_version}"
    }
}

loom {
    runtimeOnlyLog4j = true
    useIntermediateMappings = true
    intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from('NOTICE')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
